name: 增量更新 m3u

on:
  # 每 4 小时运行一次（cron 为 UTC，即北京时间 08:00 / 12:00 / 16:00 / 20:00 / 00:00 / 04:00）
  schedule:
    - cron: '0 */4 * * *'
  # 支持手动触发
  workflow_dispatch:

# 允许把更新后的 m3u 提交回仓库
permissions:
  contents: write

concurrency:
  group: update-m3u
  cancel-in-progress: false

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装浏览器兜底依赖（Patchright + Chromium）
        run: |
          npm ci
          # 先装系统依赖再装浏览器；浏览器兜底仅在前两级失败时用，
          # 安装失败不阻塞主流程（放行，让 HTTP/页面解析继续跑）
          npx patchright install-deps chromium || echo "⚠ install-deps 失败，浏览器兜底将不可用"
          npx patchright install chromium || echo "⚠ chromium 安装失败，浏览器兜底将不可用"

      - name: 增量更新 m3u（HTTP 优先，失败自动切浏览器）
        run: python3 update_m3u.py

      - name: 提交并推送更新
        run: |
          if git diff --quiet -- douyin_live.m3u; then
            echo "本轮没有新房间，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add douyin_live.m3u
            git commit -m "chore: 增量更新 douyin_live.m3u（$(date -u +'%Y-%m-%d %H:%M UTC')）"
            git push
          fi
